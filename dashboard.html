<!doctype html>
<html><head><meta charset="utf-8"><title>Vipul Sales Analytics</title>
<style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:20px}
.card{display:inline-block;border:1px solid #ddd;border-radius:12px;padding:20px;margin:8px;min-width:180px}
table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}
</style></head><body>
<h1>Vipul - Sales Analytics Dashboard</h1>
<div class="card"><b>Total Sales</b><h2>₹636,700</h2></div>
<div class="card"><b>Best Product</b><h2>Laptop</h2></div>
<div class="card"><b>Top City</b><h2>Bengaluru</h2></div>
<h2>Product Performance</h2>
<table border="1" class="dataframe">
  <thead>
    <tr style="text-align: right;">
      <th>Product</th>
      <th>Sales</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Laptop</td>
      <td>440000</td>
    </tr>
    <tr>
      <td>Monitor</td>
      <td>108000</td>
    </tr>
    <tr>
      <td>Headphones</td>
      <td>39600</td>
    </tr>
    <tr>
      <td>Keyboard</td>
      <td>33000</td>
    </tr>
    <tr>
      <td>Mouse</td>
      <td>16100</td>
    </tr>
  </tbody>
</table>
<h2>City Performance</h2>
<table border="1" class="dataframe">
  <thead>
    <tr style="text-align: right;">
      <th>City</th>
      <th>Sales</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Bengaluru</td>
      <td>211500</td>
    </tr>
    <tr>
      <td>Mumbai</td>
      <td>179600</td>
    </tr>
    <tr>
      <td>Patna</td>
      <td>157600</td>
    </tr>
    <tr>
      <td>Delhi</td>
      <td>88000</td>
    </tr>
  </tbody>
</table>
</body></html>
